<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Web Player | ShinbiTarot</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 16:9 비율 유지 컨테이너 */
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        /* JS에서 크기 계산해서 적용 */
      }

      #unity-loading-bar {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
      }

      #unity-footer {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        z-index: 10;
      }

      /* 전체화면 버튼 */
      #unity-fullscreen-button {
        cursor: pointer;
      }

      /* 모바일 가로 전체화면 유도 */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        font-size: 18px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        z-index: 999;
        text-align: center;
      }
      #rotate-hint span { font-size: 48px; }

      @media (max-width: 768px) and (orientation: portrait) {
        /* 모바일 세로일 때 회전 안내 표시 */
        /* 전체화면 진입 후엔 JS로 처리 */
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">
      <span>↺</span>
      기기를 가로로 돌려주세요
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ShinbiTarot</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // ── 16:9 비율 유지 크기 계산 ──
      function resizeCanvas() {
        var winW = window.innerWidth;
        var winH = window.innerHeight;
        var targetRatio = 16 / 9;
        var winRatio = winW / winH;

        var w, h;
        if (winRatio > targetRatio) {
          // 화면이 더 넓음 → 높이 기준
          h = winH;
          w = h * targetRatio;
        } else {
          // 화면이 더 높음 → 너비 기준
          w = winW;
          h = w / targetRatio;
        }

        canvas.style.width  = w + "px";
        canvas.style.height = h + "px";
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ── 모바일 세로 → 전체화면 시 가로 유도 ──
      var rotateHint = document.querySelector("#rotate-hint");

      function checkOrientation() {
        if (isMobile) {
          var isPortrait = window.innerHeight > window.innerWidth;
          var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
          if (isFullscreen && isPortrait) {
            rotateHint.style.display = "flex";
          } else {
            rotateHint.style.display = "none";
          }
        }
      }

      window.addEventListener('orientationchange', function() {
        setTimeout(function() { resizeCanvas(); checkOrientation(); }, 200);
      });
      document.addEventListener('fullscreenchange', function() {
        resizeCanvas(); checkOrientation();
      });
      document.addEventListener('webkitfullscreenchange', function() {
        resizeCanvas(); checkOrientation();
      });

      // ── 모바일이면 viewport 설정 ──
      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/tarot-web.loader.js";
      var config = {
        arguments: [],
        dataUrl:      buildUrl + "/tarot-web.data",
        frameworkUrl: buildUrl + "/tarot-web.framework.js",
        codeUrl:      buildUrl + "/tarot-web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:    "DefaultCompany",
        productName:    "ShinbiTarot",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";

          // 전체화면 버튼
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            if (isMobile) {
              // 모바일: 가로 전체화면 요청
              var el = document.documentElement;
              var reqFS = el.requestFullscreen || el.webkitRequestFullscreen;
              if (reqFS) {
                reqFS.call(el).then(() => {
                  // 가로 강제
                  if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                  }
                }).catch(() => {});
              }
            } else {
              unityInstance.SetFullscreen(1);
            }
          };

        }).catch((message) => { alert(message); });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
