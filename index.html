<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>tarot-web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      #unity-canvas {
        background: #000;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #fff;
        font-family: sans-serif;
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 8px;
        margin: 10px auto;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translateX(-50%);
        color: #f00;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      // 16:9(빌드 기본 해상도) 비율을 유지한 채, 화면(또는 담긴 컨테이너) 크기에 맞춰 캔버스를 줄이거나 늘린다.
      var ASPECT_W = 1920;
      var ASPECT_H = 1080;

      function resizeCanvas() {
        var container = document.getElementById("unity-container");
        var canvas = document.getElementById("unity-canvas");
        var maxWidth = container.clientWidth;
        var maxHeight = container.clientHeight;

        var targetRatio = ASPECT_W / ASPECT_H;
        var containerRatio = maxWidth / maxHeight;

        var width, height;
        if (containerRatio > targetRatio) {
          height = maxHeight;
          width = height * targetRatio;
        } else {
          width = maxWidth;
          height = width / targetRatio;
        }

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);
    </script>

    <script src="Build/14.loader.js"></script>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/14.data",
        frameworkUrl: buildUrl + "/14.framework.js",
        codeUrl: buildUrl + "/14.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "tarot-web",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";
      resizeCanvas();

      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        resizeCanvas();
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
